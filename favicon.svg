<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rounded Cozy Background Shield -->
  <rect width="128" height="128" rx="36" fill="#fbf4eb"/>
  <rect x="4" y="4" width="120" height="120" rx="32" stroke="#8da178" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Sproutling Body / Face (Cream) -->
  <ellipse cx="64" cy="74" rx="36" ry="32" fill="#fffdfa" stroke="#38271e" stroke-width="4.5"/>

  <!-- Sproutling Mushroom / Acorn Cap (Warm Coral Peach) -->
  <path d="M26 62 C26 32, 102 32, 102 62 Z" fill="#ff9e80" stroke="#38271e" stroke-width="4.5"/>

  <!-- Cap White Polka Dots -->
  <circle cx="48" cy="46" r="6" fill="#fffdfa"/>
  <circle cx="76" cy="44" r="7" fill="#fffdfa"/>
  <circle cx="62" cy="56" r="4.5" fill="#fffdfa"/>

  <!-- Green Sprout Leaf On Top -->
  <path d="M64 34 C64 16, 80 14, 84 18 C88 22, 82 34, 64 34 Z" fill="#8da178" stroke="#38271e" stroke-width="4"/>
  <path d="M64 34 C60 22, 48 20, 46 25 C44 30, 52 34, 64 34 Z" fill="#9db288" stroke="#38271e" stroke-width="3.5"/>

  <!-- Kawaii Eyes -->
  <ellipse cx="50" cy="74" rx="4.5" ry="6.5" fill="#38271e"/>
  <ellipse cx="78" cy="74" rx="4.5" ry="6.5" fill="#38271e"/>

  <!-- Eye Sparkles (White Highlights) -->
  <circle cx="51.5" cy="71.5" r="2" fill="#ffffff"/>
  <circle cx="79.5" cy="71.5" r="2" fill="#ffffff"/>

  <!-- Rosy Pink Cheeks -->
  <ellipse cx="40" cy="80" rx="5" ry="3" fill="#ffb4a2"/>
  <ellipse cx="88" cy="80" rx="5" ry="3" fill="#ffb4a2"/>

  <!-- Cute Little Smile -->
  <path d="M60 81 Q64 86 68 81" stroke="#38271e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>